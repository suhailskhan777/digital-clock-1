<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b1220;
            color: white;
            font-family: Arial, sans-serif;
        }

        .clock {
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            background: #172033;
            box-shadow: 0 0 25px #00bcd455;
        }

        #time {
            font-size: 50px;
            font-weight: bold;
            color: #00e5ff;
        }

        #ampm {
            font-size: 24px;
            color: white;
        }

        #date {
            margin-top: 20px;
            color: #cccccc;
        }
    </style>
</head>
<body>

    <div class="clock">
        <h2>Digital Clock</h2>
        <div id="time">
            00:00:00 <span id="ampm">AM</span>
        </div>
        <div id="date"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            let hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            const ampm = hours >= 12 ? "PM" : "AM";

            hours = hours % 12;
            hours = hours === 0 ? 12 : hours;

            const h = String(hours).padStart(2, "0");
            const m = String(minutes).padStart(2, "0");
            const s = String(seconds).padStart(2, "0");

            document.getElementById("time").innerHTML =
                `${h}:${m}:${s} <span id="ampm">${ampm}</span>`;

            document.getElementById("date").textContent =
                now.toLocaleDateString("en-IN", {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                });
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
